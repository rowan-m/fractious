<title>Fractious</title>
<style>
  :root {
    --font-size: 0.7rem;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    font-size: var(--font-size);
    overflow: hidden;
    background-color: black;
  }

  header {
    background-color: rgba(0, 0, 0, 0.2);
    color: oldlace;
    display: flex;
    justify-content: space-between;
    padding: 0.2rem 0.4rem 0.1rem 0.4rem;
  }

  h1 {
    font-size: var(--font-size);
    font-weight: 100;
    margin: 0;
    padding: 0;
  }

  .version {
    font-style: italic;
    font-weight: 100;
    color: silver;
  }

  a {
    color: palegoldenrod;
  }

  .render-area {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    user-select: none;
    touch-action: none;
    z-index: -1;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  #fractal-bg {
    z-index: 0;
  }

  .pin {
    position: absolute;
    width: 0px;
    height: 0px;
    top: 50%;
    left: 50%;
    right: 50%;
    display: flex;
    justify-content: center;
    align-content: flex-end;
  }

  .pinpoint {
    position: relative;
    display: inline-block;
    align-self: flex-end;
    font-size: 28px;
    text-shadow: -2px -2px 4px rgba(0, 0, 0, 0.8);
    user-select: none;
    touch-action: none;
    transition:
      opacity 100ms ease,
      transform 100ms ease-in;
    opacity: 0.001;
    transform: translateY(-40px);
  }

  .pinpoint.moving {
    opacity: 1;
    transform: translateY(0);
  }

  .stats {
    background-color: rgba(0, 0, 0, 0.2);
    color: oldlace;
    padding: 0rem 0.4rem 0.2rem 0.4rem;
  }

  .stats > form {
    display: flex;
    flex-flow: row wrap;
    font-family: monospace;
  }

  .stats label {
    border: 1px solid oldlace;
    padding: 0.2rem 0.1rem 0.2rem 0.1rem;
    margin: 0.1rem 0.1rem 0 0;
    font-size: var(--font-size);
  }

  .stats input {
    color: oldlace;
    background-color: rgba(0, 0, 0, 0.2);
    border: none;
    font-family: monospace;
    font-size: var(--font-size);
    max-width: 20vw;
  }

  input[name="centerx"],
  input[name="centery"] {
    width: 17ch;
  }
  
  input[name="zoom"] {
    width: 10ch;
  }
  
  input[name="hue"],
  input[name="huestep"],
  input[name="rotation"],
  input[name="iterations"] {
    width: 7ch;
  }

  footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
  }

  .controls {
    position: relative;
    background-color: rgba(0, 0, 0, 0.2);
  }

  .controls form {
    display: flex;
    flex-flow: row wrap;
    justify-content: space-evenly;
    align-items: center;
    align-content: center;
  }

  .controls fieldset {
    display: flex;
    flex-flow: column nowrap;
    align-items: center;
    align-content: center;
    margin: 0.5rem;
    font-size: 16px;
    border: none;
    padding: 0;
  }

  .icon {
    display: inline-block;
    margin: 0.3rem;
    user-select: none;
  }

  .controls button,
  .controls a {
    font-size: 28px;
    padding: 0;
    margin: 0;
    background: none;
    border: none;
    text-shadow: -2px -2px 4px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 166, 0, 0);
    user-select: none;
    text-decoration: none;
  }

  .controls button:focus,
  .controls button:hover,
  .controls a:hover {
    border: 1px solid rgba(255, 166, 0, 0.5);
    border-radius: 4px;
    outline: none;
  }
</style>
<header>
  <h1>Fractious</h1>
  <div>
    <span class="version">v20260302a</span>
    <a href="https://github.com/rowan-m/fractious">🧑‍💻 Code</a>
    <a href="https://rowan.fyi">🌐 rowan.fyi</a>
    <a href="https://bsky.app/profile/rowan.fyi">🦋 rowan.fyi</a>
    <a href="https://mastodon.social/@rowan_m">🦣 rowan_m@mastodon.social</a>
  </div>
</header>
<main>
  <div class="render-area">
    <canvas id="fractal-bg"></canvas>
    <canvas height="512" width="512" draggable="false" id="fractal"></canvas>
  </div>
  <div class="pin">
    <span class="pinpoint" id="crosshair">📍</span>
  </div>
  <nav class="stats">
    <form>
      <label title="Real part / x">📍x:<input type="number" name="centerx" step=".01" id="c_re"/></label>
      <label title="Imaginary part / y">📍y:<input type="number" name="centery" step=".01" id="c_im" /></label>
      <label title="Zoom">🔎<input type="number" name="zoom" step=".1" id="zoom" /></label>
      <label title="Rotation">🔄<input type="number" name="rotation" step="1" id="rotation" /></label>
      <label title="Hue">🎨<input type="number" name="hue" step=".01" id="hue" /></label>
      <label title="Hue steps">🌈<input type="number" name="huestep" step=".01" id="huestep" /></label>
      <label title="Iterations">⚙️<input type="number" name="iterations" readonly id="iterations" /></label>
    </form>
  </nav>
</main>
<footer>
  <nav class="controls">
    <form>
      <fieldset>
        <button type="button" class="incdec" name="incy" title="Move up" id="btn-up">🔼</button>
        <span>
          <button type="button" class="incdec" name="decx" title="Move left" id="btn-left">◀️</button>
          <span class="icon">📍</span>
          <button type="button" class="incdec" name="incx" title="Move right" id="btn-right">▶️</button>
        </span>
        <button type="button" class="incdec" name="decy" title="Move down" id="btn-down">🔽</button>
      </fieldset>
      <fieldset>
        <button type="button" class="incdec" name="inczoom" title="Zoom in" id="btn-zoom-in">🔼</button>
        <span class="icon">🔎</span>
        <button type="button" class="incdec" name="deczoom" title="Zoom out" id="btn-zoom-out">🔽</button>
      </fieldset>
      <fieldset>
        <button type="button" class="incdec" name="incrotate" title="Rotate clockwise" id="btn-rotate-cw">🔼</button>
        <span class="icon">🔄</span>
        <button type="button" class="incdec" name="decrotate" title="Rotate counter-clockwise" id="btn-rotate-ccw">🔽</button>
      </fieldset>
      <fieldset>
        <button type="button" class="incdec" name="inchuestep" title="Increase colour cycling" id="btn-cycle-in">🔼</button>
        <span>
          <button type="button" class="incdec" name="dechue" title="Shift colours" id="btn-hue-left">◀️</button>
          <span class="icon">🎨</span>
          <button type="button" class="incdec" name="inchue" title="Shift colours" id="btn-hue-right">▶️</button>
        </span>
        <button type="button" class="incdec" name="dechuestep" title="Decrease colour cycling" id="btn-cycle-out">🔽</button>
      </fieldset>
      <fieldset>
        <button type="button" class="fullscreen" title="Toggle fullscreen display" id="btn-fullscreen">⏫</button>
      </fieldset>
      <fieldset>
        <button type="button" class="fullscreen" title="Download screenshot" id="btn-screenshot">🖼️</button>
      </fieldset>
      <fieldset>
        <a href="." class="" title="Reset">🔁</a>
      </fieldset>
    </form>
  </nav>
</footer>
<script type="module" src="src/main.js"></script>
